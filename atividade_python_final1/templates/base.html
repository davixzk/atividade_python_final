<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}FlowTask{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('index') if 'index' in current_app.view_functions else '/' }}">
      <span class="brand-mark">F</span>
      <span>FlowTask</span>
    </a>
    <button class="menu-toggle" id="menuToggle" aria-label="Abrir menu">☰</button>
    <nav id="mainNav">
      <a href="/">Início</a>
      <a href="/login">Entrar</a>
      <a href="/cadastro">Criar conta</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
  <footer>FlowTask • organização simples para suas tarefas</footer>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
